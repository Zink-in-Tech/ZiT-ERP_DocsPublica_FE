[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Rutas antiguas (/docs/...) tras mover la documentación a la raíz del sitio
[[redirects]]
  from = "/docs"
  to = "/"
  status = 301

[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 301
